services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Identity: Data Source=/app/data/identity.db
      ConnectionStrings__Inventory: Data Source=/app/data/inventory.db
      ConnectionStrings__Cart: Data Source=/app/data/cart.db
      ConnectionStrings__Ordering: Data Source=/app/data/ordering.db
      ConnectionStrings__Payments: Data Source=/app/data/payments.db
      ConnectionStrings__Wishlist: Data Source=/app/data/wishlist.db
      MongoDb__ConnectionString: mongodb://mongodb:27017
      MongoDb__DatabaseName: ECommerce
      MongoDb__ProductsCollectionName: Products
      MongoDb__CategoriesCollectionName: categories
      ReviewsMongoDb__ConnectionString: mongodb://mongodb:27017
      ReviewsMongoDb__DatabaseName: ECommerceReviews
      ReviewsMongoDb__ReviewsCollectionName: reviews
      Redis__ConnectionString: redis:6379,abortConnect=false,connectTimeout=500,syncTimeout=500
      Redis__InstanceName: "ECommerce:"
      Jwt__Key: ${JWT_KEY:?JWT_KEY must be set; copy .env.example to .env}
      Stripe__Enabled: ${STRIPE_ENABLED:-false}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ecommerce-api-data:/app/data

  mongodb:
    image: mongo:7
    container_name: ecommerce-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ecommerce-mongodb-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - ecommerce-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ecommerce-api-data:
  ecommerce-mongodb-data:
  ecommerce-redis-data:
